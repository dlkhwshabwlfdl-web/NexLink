[package]
name = "nxcore"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "NexLink core: NXLP wire protocol, user-space TCP/IP stack and relay engine"

[dependencies]
smoltcp = { version = "0.12", default-features = false, features = [
    "std",
    "alloc",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
] }
