name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    name: Core (protocol + engine end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the test suite
        run: bash pc/test-e2e.sh

  android:
    name: Android app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nexlink-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows-app:
    name: Windows tray app (NSIS installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # WinTun driver library: the tray app loads it at runtime (see
      # pc/app/src-tauri/src/wintun_backend.rs) and the installer bundles
      # it as a Tauri resource (tauri.conf.json). Pinned to the official
      # wintun.net release and verified by SHA-256 before use; bump both
      # values together when a newer WinTun ships.
      - name: Fetch WinTun driver library (pinned + SHA-256 checked)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.14.1'
          $expected = '07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51'
          $zip = "$env:RUNNER_TEMP\wintun-$version.zip"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-$version.zip" -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "wintun-$version.zip SHA-256 mismatch: got $actual, expected $expected" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\wintun" -Force
          New-Item -ItemType Directory -Force -Path pc/app/src-tauri/resources | Out-Null
          Copy-Item "$env:RUNNER_TEMP\wintun\wintun\bin\amd64\wintun.dll" pc/app/src-tauri/resources/wintun.dll
      # adb (Android platform-tools): the USB transport shells out to
      # `adb forward` (see adb_command in main.rs), so the installer
      # bundles adb.exe + its two DLLs as Tauri resources — USB then
      # works on a PC with no Android tooling installed. Fetched from
      # Google's official repository. The SHA-256 pins the current
      # "latest" zip; when Google refreshes it this step fails loudly
      # and the hash must be updated (same pattern as WinTun above).
      - name: Fetch adb (platform-tools, SHA-256 checked)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '45F4D63113E895EBDE0C90F194099A4676B6AC653BD28D54314A9E022BBC1A99'
          $zip = "$env:RUNNER_TEMP\platform-tools.zip"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "platform-tools.zip SHA-256 mismatch: got $actual, expected $expected" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\platform-tools" -Force
          New-Item -ItemType Directory -Force -Path pc/app/src-tauri/resources | Out-Null
          Copy-Item "$env:RUNNER_TEMP\platform-tools\platform-tools\adb.exe" pc/app/src-tauri/resources/adb.exe
          Copy-Item "$env:RUNNER_TEMP\platform-tools\platform-tools\AdbWinApi.dll" pc/app/src-tauri/resources/AdbWinApi.dll
          Copy-Item "$env:RUNNER_TEMP\platform-tools\platform-tools\AdbWinUsbApi.dll" pc/app/src-tauri/resources/AdbWinUsbApi.dll
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the NSIS installer
        working-directory: pc/app/src-tauri
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: nexlink-windows-installer
          path: pc/app/src-tauri/target/release/bundle/nsis/*.exe
